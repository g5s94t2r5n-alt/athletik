<!doctype html>
<html lang="de" data-design="d">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Athletik</title>
  <meta name="description" content="Evidenzbasierter Trainingsplan für Muskelaufbau und Athletik, der sich an deine Leistung anpasst.">
  <meta name="theme-color" content="#13111a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Athletik">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/design-d.css">
</head>
<body>
  <main id="view" class="view"></main>

  <div id="timer" class="timer" hidden>
    <div class="timer-bar"><div id="timer-bar"></div></div>
    <div class="timer-row">
      <span class="muted small">Pause</span>
      <strong id="timer-val">0:00</strong>
      <button class="chip small" data-action="timer-minus">−15 s</button>
      <button class="chip small" data-action="timer-plus">+15 s</button>
      <button class="chip small" data-action="timer-stop">Stopp</button>
    </div>
  </div>

  <nav class="tabs">
    <button class="tab active" data-view="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11" /></svg><span>Training</span></button>
    <button class="tab" data-view="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg><span>Verlauf</span></button>
    <button class="tab" data-view="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M7 15l4-4 3 3 5-6" /></svg><span>Fortschritt</span></button>
    <button class="tab" data-view="coach"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.2 5.3L20 9l-4.3 3.8L17 18.5 12 15.6 7 18.5l1.3-5.7L4 9l5.8-.7z" /></svg><span>Coach</span></button>
    <button class="tab" data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" /></svg><span>Mehr</span></button>
  </nav>

  <div id="modal" class="modal" hidden><div class="sheet" id="modal-body"></div></div>
  <div id="toast" class="toast" hidden role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
